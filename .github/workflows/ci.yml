name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # The official image from Amazon's public mirror. Docker Hub rate
        # limits anonymous pulls from shared runners, which fails this job
        # before any check runs.
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_DB: obliq
          POSTGRES_USER: obliq
          POSTGRES_PASSWORD: obliq
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U obliq -d obliq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://obliq:obliq@127.0.0.1:5432/obliq
      TEST_DATABASE_URL: postgresql://obliq:obliq@127.0.0.1:5432/obliq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run validate
      - run: cargo fmt --check --manifest-path tools/zcash-observer/Cargo.toml
      - run: cargo check --locked --manifest-path tools/zcash-observer/Cargo.toml
      - run: cargo test --locked --manifest-path tools/zcash-observer/Cargo.toml
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file tools/zcash-observer/Cargo.lock
      - run: npm run security:secrets
      - run: npm audit --omit=dev --audit-level=high
