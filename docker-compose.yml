services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: obliq
      POSTGRES_USER: obliq
      POSTGRES_PASSWORD: obliq
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obliq"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - obliq-postgres:/var/lib/postgresql/data

volumes:
  obliq-postgres:
