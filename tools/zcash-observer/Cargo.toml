[package]
name = "obliq-zcash-observer"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1.89"
futures-util = "0.3.31"
hex = "0.4.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.14.1", features = ["transport", "tls-ring", "tls-native-roots"] }
zcash_client_backend = { version = "=0.24.0", features = ["sync", "lightwalletd-tonic-transport", "orchard"] }
zcash_client_sqlite = { version = "=0.22.0", features = ["orchard"] }
zcash_keys = { version = "=0.16.1", features = ["orchard", "sapling"] }
zcash_primitives = "=0.30.1"
zcash_protocol = { version = "=0.10.6", features = ["local-consensus"] }
zeroize = "1.8.2"

[dev-dependencies]
zcash_transparent = "=0.10.0"
zip32 = "0.2.1"
